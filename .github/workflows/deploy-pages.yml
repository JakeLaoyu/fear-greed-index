name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
          # Cache-bust app assets so a deploy never mixes new HTML with cached old JS/CSS.
          v="${GITHUB_SHA::7}"
          sed -i -e "s#assets/app.js\"#assets/app.js?v=$v\"#" \
                 -e "s#assets/style.css\"#assets/style.css?v=$v\"#" \
                 -e "s#assets/vendor/echarts.min.js\"#assets/vendor/echarts.min.js?v=5.5.1\"#" _site/index.html
          grep -n '?v=' _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
