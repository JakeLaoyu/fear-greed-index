name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
          # Cache-bust app assets so a deploy never mixes new HTML with cached old JS/CSS.
          v="${GITHUB_SHA::7}"
          sed -i -e "s#assets/app.js\"#assets/app.js?v=$v\"#" \
                 -e "s#assets/style.css\"#assets/style.css?v=$v\"#" \
                 -e "s#assets/vendor/echarts.min.js\"#assets/vendor/echarts.min.js?v=5.5.1\"#" _site/index.html
          grep -n '?v=' _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # deploy-pages can look up the run's artifacts before the upload above is
      # visible and fail with 'No artifacts named "github-pages"'
      # (actions/deploy-pages#451). Retry just this step: re-running the whole
      # job would upload a second artifact and fail on the duplicate.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.deploy1.outcome == 'failure'
        run: sleep 15

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.deploy2.outcome == 'failure'
        run: sleep 45

      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
